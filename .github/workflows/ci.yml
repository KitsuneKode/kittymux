name: ci

on:
  push:
    branches: [main]
  pull_request:

# kittymux wraps a few kitty internals, so CI runs the real-kitty smoke tests against every kitty
# release the project is tested with (TESTED_KITTY_MINOR in bin/kittymux) — add a version here when a
# new release passes locally, drop the oldest when it stops being supported.

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # scan the whole history, not just the tip
      - name: gitleaks (every commit)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e   # v3.0.0, pinned by commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: python unit tests
        run: |
          python3 -m pip install --quiet fonttools      # the icon-font coverage tests read the font's real glyph table
          python3 -m unittest discover -s tests
      - name: shell tests
        run: bash tests/test_mux_status.sh && bash tests/test_socket_lib.sh
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          files=$(for f in bin/* lib/*.sh install.sh tests/*.sh; do [ -f "$f" ] && head -1 "$f" | grep -qE 'bash|/sh' && echo "$f"; done)
          shellcheck -S error $files

  smoke:
    runs-on: ubuntu-24.04
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        kitty: ["0.49.1", "0.49.2"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # smoke_reload.sh upgrades a kitty running an OLD release of the modules
      - name: system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool imagemagick libxfixes3 bc jq fzf fontconfig dbus \
            libgl1-mesa-dri libglx-mesa0 libegl1 libxkbcommon-x11-0 libxcb-xkb1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-image0 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcursor1 libxi6 libxrandr2
      - name: kitty ${{ matrix.kitty }}
        run: |
          curl -fsSL https://sw.kovidgoyal.net/kitty/installer.sh | sh /dev/stdin launch=n dest="$HOME/.local" installer="version-${{ matrix.kitty }}"
          echo "$HOME/.local/kitty.app/bin" >> "$GITHUB_PATH"
      - name: fresh-machine install / uninstall
        run: bash tests/test_install.sh
      - name: agent states, spinner, tab hit-testing (real kitty)
        run: bash tests/smoke_state.sh
      - name: sidebar collapse button + drag (real mouse events)
        run: bash tests/smoke_sidebar.sh
      - name: tab drag-to-reorder (real pointer events)
        run: bash tests/smoke_drag.sh
      - name: session save/restore resumes agents (real kitties)
        run: bash tests/smoke_resume.sh
      - name: socket-only refuses in-band control; private runtime-dir socket works
        run: bash tests/smoke_socket.sh
      - name: spawn / pick / reopen / mute in a real kitty
        run: bash tests/smoke_spawn.sh
      - name: what the agent changed (snapshots at run start/end, repo untouched)
        run: bash tests/smoke_changes.sh
      - name: fan-out (one prompt, several agents, a worktree each)
        run: bash tests/smoke_fanout.sh
      - name: inbox from real OSC 99 agent notifications
        run: bash tests/smoke_inbox.sh
      - name: tab clicks survive wobble; agent tabs survive a stray middle-click
        run: bash tests/smoke_click.sh
      - name: native divider (drawn by kitty, native resize arrow and drag; kitty >= 0.49.2)
        run: bash tests/smoke_native.sh
      - name: bar resize keeps up with a fast pointer (real pointer events)
        run: bash tests/smoke_resize.sh
      - name: pane jump keys agree with the pane overview (real key events)
        run: bash tests/smoke_panes.sh
      - name: kittymux demo opens every showcase tab
        run: bash tests/smoke_demo.sh
      - name: keymap overlay closes in one keypress, searches, scrolls
        run: bash tests/smoke_keys.sh
      - name: clickable file:line (kitty >= 0.49.2) and screenshots
        run: |
          bash tests/smoke_openref.sh
          bash tests/smoke_extras.sh
      - name: two-instance scratch safety and unnamed-session attention jump
        run: bash tests/smoke_workflows.sh
      - name: an upgraded, running kitty draws cleanly after two reloads
        run: bash tests/smoke_reload.sh
      - name: kitty survives a timer being removed inside a timer callback (the 2026-10-07 crash), with a control that proves the rig can see it
        run: bash tests/smoke_timers.sh
      - name: scripts written for /tmp/mykitty-<pid> still find kitty when its socket lives in a private directory
        run: bash tests/smoke_legacy_socket.sh
      - name: a plain terminal waiting on you (sudo, ssh, pacman) is announced once
        run: bash tests/smoke_prompts.sh
      - name: command palette and quick look (real keys and mouse)
        run: |
          bash tests/smoke_palette.sh
          bash tests/smoke_peek.sh
      - name: tab titles, pane title bars, native pane controls
        run: |
          bash tests/smoke_titles.sh
          bash tests/smoke_panetitle.sh
          bash tests/smoke_pane_ux.sh
      - name: join tabs (CLI and picker), exit save, workflow argv
        run: |
          bash tests/smoke_join.sh
          bash tests/smoke_join_ui.sh
          bash tests/smoke_exit_save.sh
          bash tests/smoke_workflow_argv.sh
