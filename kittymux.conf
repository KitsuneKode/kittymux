# kittymux.conf — core options. Path-free: safe to include from
# ~/.config/kitty/kitty.conf alongside the generated kittymux-keys.conf.

# ── Tab bar (custom draw: session-aware titles, git anchor, agent glyphs) ──
tab_bar_edge            bottom
tab_bar_style           custom
tab_bar_min_tabs        2
tab_title_template      {title}
# Only show the active session's tabs; parked sessions stay hidden.
tab_bar_filter          session:.

# ── Splits: proportional new panes, rebalance when one closes (kitty 0.49+) ──
# NOTE: opts inside splits: are ;-separated — a comma starts the next layout.
enabled_layouts         splits:equalize_on_window_close=y;proportional=y, *

# ── 0.49: scrollbar only while scrolling or hovering its region ──
scrollbar               scrolled-or-hovered
# ── 0.49: 3 lines per tab max: session header + title + subtitle (heights are dynamic) ──
tab_title_max_lines     3
# bold, not bold-italic — italic tab titles look broken on vertical edges
active_tab_font_style   bold

# ── Split borders: separators between panes only ──
# Your WM/compositor already rings the OS window; a kitty ring doubles it.
# (window_border_radius requires full borders — leave it off with this)
draw_minimal_borders    yes
# 1.5pt: the default 0.5pt split separator is invisible on hidpi
window_border_width     1.5pt

# ── Pane title bars: off ──
# kitty can draw a title bar on every pane of a split tab; it is also the handle for kitty's native drag & drop
# (split → tab, split → another tab, re-split). It looks heavy, so it stays off; ctrl+alt+shift+w shows the bars
# on demand (see kittymux-keys.conf.tpl) — drag, drop, press it again. The pane's folder is on ctrl+alt+i.
window_title_bar            top
window_title_bar_min_windows 0

# ── Notifications: kittymux owns them ──
# Agent CLIs (Claude Code, Codex, Devin, …) also ask the terminal for their own desktop notifications, and kitty
# shows them — on top of kittymux's ("needs you" / "finished", with a jump action). Drop the agents' so each event
# notifies once. Delete the line to let them through again. kitty's own notices (notify_on_cmd_finish) are unaffected.
filter_notification title:"(?i)^(claude|codex|devin|gemini|opencode|amp|droid|cursor|grok|qwen|kimi|kilo|auggie|junie|antigravity|agy)\b" or app:"(?i)^(claude|codex|devin|gemini|opencode|amp|droid|grok|qwen|kimi|kilo|auggie|junie|antigravity|agy)"

# ── Brand icons: real provider logos at Plane-16 private codepoints ──
# Font is installed by install.sh to ~/.local/share/fonts/kittymux-icons.ttf
symbol_map U+E0D8-U+E0FF,U+10EA01-U+10EA3F kittymux icons

# Remote control socket — required by every mux- script. Choose your own
# path; the scripts resolve sockets dynamically, this just enables the RC API.
# listen_on unix:/tmp/mykitty
