# kittymux.conf — core options. Path-free: safe to include from
# ~/.config/kitty/kitty.conf alongside the generated kittymux-keys.conf.

# ── Tab bar (custom draw: session-aware titles, git anchor, agent glyphs) ──
tab_bar_edge            bottom
tab_bar_style           custom
tab_bar_min_tabs        2
tab_title_template      {title}
# Only show the active session's tabs; parked sessions stay hidden.
tab_bar_filter          session:.

# ── Splits: proportional new panes, rebalance when one closes (kitty 0.49+) ──
# NOTE: opts inside splits: are ;-separated — a comma starts the next layout.
enabled_layouts         splits:equalize_on_window_close=y;proportional=y, *

# ── 0.49: scrollbar only while scrolling or hovering its region ──
scrollbar               scrolled-or-hovered
# ── 0.49: two-line titles keep long agent titles readable on the side ──
tab_title_max_lines     2

# ── Split borders (required for the rounded corners below) ──
draw_minimal_borders    no
window_border_radius    1pt

# ── Brand icons: real provider logos at Plane-16 private codepoints ──
# Font is installed by install.sh to ~/.local/share/fonts/kittymux-icons.ttf
symbol_map U+E0D8-U+E0E0,U+10EA01-U+10EA09 kittymux icons

# Remote control socket — required by every mux- script. Choose your own
# path; the scripts resolve sockets dynamically, this just enables the RC API.
# listen_on unix:/tmp/mykitty
